<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>System Monitor</title>

 <style>
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
    .card { background: #f5f5f5; border-radius: 8px; padding: 14px 16px; }
  .sm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
  .sm-card{background:#f5f5f5;border-radius:8px;padding:12px 14px}
  .lbl{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
  .val{font-size:22px;font-weight:500;line-height:1}
  .sub{font-size:12px;color:#666;margin-top:4px}
  .bar{height:3px;border-radius:2px;background:#e0e0e0;margin-top:10px;overflow:hidden}
  .bar-f{height:100%;border-radius:2px;background:#534AB7}
  .sm-info{background:#f5f5f5;border-radius:8px;padding:12px 14px;margin-bottom:10px}
  .sm-info table{width:100%;border-collapse:collapse}
  .sm-info td{padding:3px 0;font-size:13px}
  .sm-info td:last-child{text-align:right;font-weight:500;font-family:monospace}
  .sm-section{font-size:11px;text-transform:uppercase;color:#888;margin:1rem 0 6px}
  .load-dots{display:flex;gap:8px}
  .load-dot{flex:1;background:#f5f5f5;border-radius:8px;padding:10px;text-align:center}
  .lv{font-size:18px;font-weight:500;font-family:monospace}
  .lt{font-size:11px;color:#888;margin-top:2px}
</style>
</head>
<body>
<header>
  <a href="/auth/register">Register</a>
  <a href="/auth/login">Login</a>
</header>
<div
  id="stats"
  hx-get="/system/all?unit=gb&type=html"
  hx-trigger="load, every 2s"
  hx-swap="innerHTML"
  hx-indicator="#loader"
>
  Загрузка...
</div>

<span id="loader" class="htmx-indicator">⟳ обновление</span>

<script src="https://unpkg.com/htmx.org@2.0.4"></script>
</body>
</html>
